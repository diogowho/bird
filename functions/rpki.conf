function rpki_status() -> enum roa {
  case net.type {
    NET_IP4: {
      return roa_check(tab_roa4, net, bgp_path.last_nonaggregated);
    }
    NET_IP6: {
      return roa_check(tab_roa6, net, bgp_path.last_nonaggregated);
    }
  }
}

function drop_rpki_invalid() {
  if rpki_status() = ROA_INVALID
    then reject;
}
