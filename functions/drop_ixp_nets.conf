define IXP_NETS_IP4 = [
  185.0.30.0/24+,  # FogIXP Frankfurt
  185.1.147.0/24+, # FogIXP Europe
  149.112.50.0/24  # ONIX
];

define IXP_NETS_IP6 = [
  2001:7f8:11c:1::/64+,  # FogIXP Frankfurt
  2001:7f8:ca:1::/64+,   # FogIXP Europe
  2001:504:125:e1::/64+  # ONIX
];

function ixp_net() -> bool {
  case net.type {
    NET_IP4: {
      return net ~ IXP_NETS_IP4;
    }
    NET_IP6: {
      return net ~ IXP_NETS_IP6;
    }
  }
}

function drop_ixp_nets() {
  if ixp_net() then reject;
}
