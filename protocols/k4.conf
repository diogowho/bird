protocol kernel k4 {
  scan time 10;

  ipv4 {
    table kernel4;

    import all;
    export all;
  };
}

protocol pipe k4_master {
  table master4;
  peer table kernel4;

  export filter {
    if source = RTS_STATIC then accept;
    if source != RTS_BGP then reject;

    if dest = RTD_UNREACHABLE then {
      if failed_rsec > 0
        then accept;
        else reject;
    }

    krt_prefsrc = IP4_HOST;

    int src_type = bgp_large_community.filter([(ASN_SELF, INFO_SOURCE, *)]).max.data2;

    if src_type !~ [SELF, DOWN] then reject;

    accept;
  };

  import none;
}
