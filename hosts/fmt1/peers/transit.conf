protocol bgp up_pdx1 from peer6 {
  neighbor 2602:fa7e:13:2::a as 52025;

  ipv6 {
    import where incoming(52025, TRANSIT);
    export where outgoing(52025, TRANSIT);
  };

  default bgp_local_pref TRANSIT;
  local role customer;

  multihop;
}

