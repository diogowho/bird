protocol bgp up_ifog from peer6 {
  neighbor 2a0c:9a40:1030::1 as 34927;

  ipv6 {
    import where incoming(34927, TRANSIT);
    export where outgoing(34927, TRANSIT);
  };

  default bgp_local_pref TRANSIT;
  local role customer;
}

protocol bgp up4_ifog from peer4 {
  neighbor 193.148.249.1 as 34927;

  ipv4 {
    import where incoming(34927, TRANSIT);
    export where outgoing(34927, TRANSIT);
  };

  default bgp_local_pref TRANSIT;
  local role customer;
}
